# Options
set -g default-terminal "tmux-256color"
# Run panes as a non-login shell. Avoids macOS path_helper re-running on every
# pane and reordering Nix out of PATH; panes inherit the correct PATH from the
# server's login shell. $SHELL is fish (the login shell), so panes are fish.
set -g default-command "exec $SHELL"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 1000000
set -sg escape-time 0
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on
set -g mouse on
set -g detach-on-destroy off
set -g mode-keys vi

# Keybindings
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind p display-popup -E "~/.config/tmux/scripts/switch-project.sh"
bind s display-popup -E "~/.config/tmux/scripts/switch-session.sh"

# Remap copy mode keys to match Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape if-shell -F "#{selection_present}" "send-keys -X clear-selection" "send-keys -X cancel"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.1.2'

# Remain in copy mode after yanking text
set -g @yank_action 'copy-pipe'

# Catppuccin (matches Ghostty + nvim frappe)
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_border_style "fg=#{@thm_crust}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_crust}"
set -g @catppuccin_status_background "#{@thm_bg}"

# Status bar
set -g status-position top
set -g status-justify "absolute-centre"
set -g status-left ""
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# Window style
# Window names aggregate what's running across a window's panes. Each fish pane
# records its command in a pane-scoped @winname option (devenv's auto-activation
# subshell hides the real command from pane_current_command, so we set it
# ourselves); winname.sh joins the non-idle panes into the name, e.g.
# "claude | nvim". fish rebuilds on command start/stop; this hook rebuilds when
# panes open or close. automatic-rename stays off (we set names ourselves) and
# allow-rename off so apps can't hijack the name with title escapes.
set -g automatic-rename off
set -g allow-rename off
set-hook -g window-layout-changed 'run-shell -b "~/.config/tmux/scripts/winname.sh #{window_id}"'
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@thm_fg},bg=#{@thm_surface_1}] #I #[fg=#{@thm_crust},bg=#{@thm_surface_1}]▏#[fg=#{@thm_fg}]#W "
set -g window-status-current-format "#{?#{==:#{session_windows},1},,#[fg=#{@thm_bg}]#[bg=#{@thm_blue}] #I #[fg=#{@thm_crust}]▏#[fg=#{@thm_bg}]#W }"

run '~/.tmux/plugins/tpm/tpm'
