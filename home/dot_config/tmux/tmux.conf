# Options
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 1000000
set -sg escape-time 0
set -g mouse on
set -g detach-on-destroy off
set -g mode-keys vi

# Keybindings
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind p display-popup -E "~/.config/tmux/scripts/switch-project.sh"
bind s display-popup -E "~/.config/tmux/scripts/switch-session.sh"
bind Tab switch-client -l
bind BSpace last-window
bind \; last-pane

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.1.2'

# Catppuccin (matches Ghostty + nvim frappe)
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_border_style "fg=#{@thm_crust}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_crust}"
set -g @catppuccin_status_background "#{@thm_bg}"

# Status bar
set -g status-position top
set -g status-justify "absolute-centre"
set -g status-left ""
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
# set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
# set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|/Users/$USER|~|:#{pane_current_path}}} "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# Window style
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@thm_fg},bg=#{@thm_surface_1}] #I #[fg=#{@thm_crust},bg=#{@thm_surface_1}]▏#[fg=#{@thm_fg}]#W "
set -g window-status-current-format "#{?#{==:#{session_windows},1},,#[fg=#{@thm_bg}]#[bg=#{@thm_blue}] #I #[fg=#{@thm_crust}]▏#[fg=#{@thm_bg}]#W }"

run '~/.tmux/plugins/tpm/tpm'
